<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section id="wrapper">
        <h1>Sequencer</h1>
        <div id="sequencer">
            <div class="row">
                <button class="sound-button" data-sound="kick">Kick</button>
                <div class="steps">
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                </div>
            </div>
            <div class="row">
                <button class="sound-button" data-sound="clap">Clap</button>
                <div class="steps">
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                </div>
            </div>
            <div class="row">
                <button class="sound-button" data-sound="hihat">Hi-Hat</button>
                <div class="steps">
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                </div>
            </div>
            <div class="row">
                <button class="sound-button" data-sound="bass">Bass</button>
                <div class="steps">
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                    <button class="step"></button>
                </div>
            </div>
        </div>
        <div id="controls">
            <label for="tempo-slider">Tempo: <span id="tempo-display">135</span></label>
            <input type="range" id="tempo-slider" min="60" max="180" value="120">
            <button id="start-button">Start</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
